name: APK Uretici

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create . --platforms=android,web

      # ANDROID İNTERNET İZNİ EKLEME (VERİ HATASINI ÇÖZEN ADIM)
      - run: |
          python3 -c "
          path = 'android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          content = content.replace('<application', '<uses-permission android:name=\"android.permission.INTERNET\"/>\n    <application')
          with open(path, 'w') as f:
              f.write(content)
          "

      - run: flutter pub get

      # 1. Android APK
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: balsuyu-servis-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 2. iPhone Web (Büyük B Harfi ile)
      - run: flutter build web --release --base-href "/Balsuyu-son/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
