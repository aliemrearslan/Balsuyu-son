name: APK Uretici

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - run: flutter create . --platforms=android,web

      # ANDROID İZİNLERİ VE BİLDİRİM (DESUGARING) AYARINI OTOMATİK AÇAR:
      - run: |
          python3 -c "
          import os

          # 1. Bildirim ve İnternet İzinlerini Ekle
          m_path = 'android/app/src/main/AndroidManifest.xml'
          if os.path.exists(m_path):
              with open(m_path, 'r') as f:
                  m = f.read()
              perms = '''
              <uses-permission android:name=\"android.permission.INTERNET\"/>
              <uses-permission android:name=\"android.permission.VIBRATE\"/>
              <uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"/>
              <uses-permission android:name=\"android.permission.SCHEDULE_EXACT_ALARM\"/>
              <uses-permission android:name=\"android.permission.POST_NOTIFICATIONS\"/>
              <application'''
              m = m.replace('<application', perms)
              with open(m_path, 'w') as f:
                  f.write(m)

          # 2. Desugaring (Java 8 Zaman Desteği) Ayarını Aç
          g_path = 'android/app/build.gradle' if os.path.exists('android/app/build.gradle') else ('android/app/build.gradle.kts' if os.path.exists('android/app/build.gradle.kts') else None)
          if g_path:
              with open(g_path, 'r') as f:
                  g = f.read()
              if 'build.gradle.kts' in g_path:
                  g = g.replace('compileOptions {', 'compileOptions {\n        isCoreLibraryDesugaringEnabled = true')
                  if 'dependencies {' in g:
                      g = g.replace('dependencies {', 'dependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")')
                  else:
                      g += '\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n'
              else:
                  g = g.replace('compileOptions {', 'compileOptions {\n        coreLibraryDesugaringEnabled true')
                  if 'dependencies {' in g:
                      g = g.replace('dependencies {', \"dependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\")
                  else:
                      g += \"\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'\n}\n\"
              with open(g_path, 'w') as f:
                  f.write(g)
          "

      - run: flutter pub get

      # 1. Android APK
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: balsuyu-servis-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # 2. iPhone Web
      - run: flutter build web --release --base-href "/Balsuyu-son/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
